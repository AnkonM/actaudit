# ActAudit theme. Both [theme.light] and [theme.dark] are defined so visitors can
# switch modes from the settings menu (a plain [theme] would lock one mode).
#
# The primary colour is indigo on purpose: red, amber and green are reserved for
# risk-tier verdicts, so the Analyze button must never look like one.
# Tier text tones (red/orange/green below) are tuned per mode for readable text;
# the verdict banner uses its own fill/text pairs (app.py, VERDICT CSS block).

[theme]
font = "Inter:https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
codeFont = "'JetBrains Mono':https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap"
codeFontSize = "0.85rem"
baseFontSize = 15
baseFontWeight = 400
headingFontSizes = ["32px", "24px", "20px", "16px", "14px", "12px"]
headingFontWeights = [700, 600, 600, 600, 600, 500]
baseRadius = "medium"
buttonRadius = "medium"
showWidgetBorder = true
showSidebarBorder = true
linkUnderline = false

[theme.light]
primaryColor = "#3949AB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FA"
codeBackgroundColor = "#F5F7FA"
textColor = "#1F2330"
linkColor = "#3949AB"
borderColor = "#D8DCE5"
dataframeHeaderBackgroundColor = "#F5F7FA"
redColor = "#C62828"
orangeColor = "#B45309"
yellowColor = "#A16207"
greenColor = "#2E7D32"
blueColor = "#3949AB"
grayColor = "#5B6270"

[theme.light.sidebar]
backgroundColor = "#F5F7FA"
secondaryBackgroundColor = "#FFFFFF"
borderColor = "#D8DCE5"

[theme.dark]
primaryColor = "#5C6BC0"
backgroundColor = "#0F1117"
secondaryBackgroundColor = "#1A1D27"
codeBackgroundColor = "#1A1D27"
textColor = "#E6E8EE"
linkColor = "#9FA8DA"
borderColor = "#2E3240"
dataframeHeaderBackgroundColor = "#1A1D27"
redColor = "#FF6B6B"
orangeColor = "#FBBF24"
yellowColor = "#FACC15"
greenColor = "#4ADE80"
blueColor = "#9FA8DA"
grayColor = "#9AA1AF"

[theme.dark.sidebar]
backgroundColor = "#0B0D12"
secondaryBackgroundColor = "#1A1D27"
borderColor = "#2E3240"
